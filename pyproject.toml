[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oqteris"
version = "1.2.1"
description = "Professional cross-platform desktop PDF reader and editor"
readme = "README.md"
authors = [
    { name = "Subhadip Dutta", email = "subhadip6869@users.noreply.github.com" }
]
maintainers = [
    { name = "OriginSD", email = "contact@originsd.vercel.app" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Printing",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
keywords = ["pdf", "reader", "editor", "pyside6", "qml", "ocr", "digital-signature", "pymupdf", "pikepdf", "pyhanko"]
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8.0",
    "PyMuPDF>=1.24.0",
    "pikepdf>=8.15.0",
    "pyhanko>=0.25.0",
    "pyhanko-certvalidator>=0.26.0",
    "cryptography>=43.0.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.0",
    "opencv-python-headless>=4.10.0",
    "pytesseract>=0.3.10",
    "ocrmypdf>=16.0.0",
    "pydantic>=2.7.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "nuitka>=2.4.0",
]

[project.scripts]
oqteris = "oqteris.main:main"

[project.urls]
Homepage = "https://originsd.vercel.app"
Repository = "https://github.com/subhadip6869/Oqteris-Desktop"
Issues = "https://github.com/subhadip6869/Oqteris-Desktop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oqteris.ui.qml" = ["**/*.qml", "**/*.js", "qmldir"]
"oqteris.resources" = ["**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "pdf: PDF rendering and manipulation tests",
    "signatures: Digital signature and certificate tests",
    "ocr: OCR and document recognition tests",
    "security: Security and validation tests",
    "ui: UI and controller tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501"]
