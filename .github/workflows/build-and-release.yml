name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a public GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Continuous Integration
  # -------------------------------------------------------------
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1 tesseract-ocr tesseract-ocr-eng

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v --junitxml=junit/test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: junit/test-results.xml

  # -------------------------------------------------------------
  # Job 2: Build Native Installers & Standalone Packages
  # -------------------------------------------------------------
  build-release:
    name: Build Packages (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact-name: Oqteris-Windows-x64
          - os: macos-latest
            target: macos-arm64
            artifact-name: Oqteris-macOS-arm64
          - os: ubuntu-latest
            target: linux-x64
            artifact-name: Oqteris-Linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev libgl1-mesa-dev libxkbcommon-x11-0 libegl1 tesseract-ocr

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka setuptools wheel

      # --- Windows: Executable Installer & Portable Zip ---
      - name: Build Windows Installer (.exe) & Portable Zip (.zip)
        if: runner.os == 'Windows'
        run: |
          python scripts/build_nuitka.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/setup.iss
          Compress-Archive -Path dist/Oqteris.dist/* -DestinationPath dist/Oqteris-1.0.0-Windows-x64-Portable.zip

      # --- macOS: DMG Drag-and-Drop Installer & App Bundle Zip ---
      - name: Build macOS DMG Installer (.dmg) & Zip (.zip)
        if: runner.os == 'macOS'
        run: |
          python scripts/build_nuitka.py
          mkdir -p dist/dmg_staging
          cp -r dist/Oqteris.app dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create -volname "Oqteris" -srcfolder dist/dmg_staging -ov -format UDZO dist/Oqteris-1.0.0-macOS-arm64.dmg
          rm -rf dist/dmg_staging
          ditto -c -k --sequesterRsrc --keepParent dist/Oqteris.app dist/Oqteris-1.0.0-macOS-arm64.zip

      # --- Linux: Debian Package (.deb) & Portable Tarball (.tar.gz) ---
      - name: Build Linux Debian Package (.deb) & Portable (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          python scripts/build_nuitka.py
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/opt/oqteris
          mkdir -p deb-pkg/usr/bin
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p deb-pkg/usr/share/icons/hicolor/256x256/apps

          cp -r dist/Oqteris.dist/* deb-pkg/opt/oqteris/
          chmod +x deb-pkg/opt/oqteris/Oqteris*

          cat << 'EOF' > deb-pkg/usr/bin/oqteris
          #!/bin/sh
          exec /opt/oqteris/Oqteris "$@"
          EOF
          chmod +x deb-pkg/usr/bin/oqteris

          cp packaging/linux/org.originsd.oqteris.desktop deb-pkg/usr/share/applications/
          cp assets/icons/app/oqteris-logo.png deb-pkg/usr/share/icons/hicolor/256x256/apps/org.originsd.oqteris.png

          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: oqteris
          Version: 1.0.0
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: Subhadip Dutta <subhadip6869@users.noreply.github.com>
          Homepage: https://originsd.vercel.app
          Description: Complete Cross-Platform PDF Reader and Editor
           Oqteris is a dedicated desktop PDF reader, editor, annotator, and security
           suite built with Python and Qt Quick/QML. Features high-performance rendering,
           digital signatures validation, OCR recognition, and document optimization.
          EOF

          dpkg-deb --build deb-pkg dist/Oqteris-1.0.0-Linux-x64.deb
          tar -czf dist/Oqteris-1.0.0-Linux-x64-Portable.tar.gz -C dist Oqteris.dist

      - name: Upload Platform Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz

  # -------------------------------------------------------------
  # Job 3: Publish GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Create GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.deb
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
