name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Continuous Integration
  # -------------------------------------------------------------
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1 tesseract-ocr tesseract-ocr-eng

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v --junitxml=junit/test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: junit/test-results.xml

  # -------------------------------------------------------------
  # Job 2: Build Release Artifacts (Runs on Tag or Manual Dispatch)
  # -------------------------------------------------------------
  build-release:
    name: Build Packages
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact-name: Oqteris-Windows-x64
          - os: macos-latest
            target: macos-arm64
            artifact-name: Oqteris-macOS-arm64
          - os: ubuntu-latest
            target: linux-x64
            artifact-name: Oqteris-Linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka setuptools wheel

      - name: Build Windows Standalone Package
        if: runner.os == 'Windows'
        run: |
          python scripts/build_nuitka.py
          Compress-Archive -Path dist/Oqteris.dist/* -DestinationPath dist/Oqteris-1.0.0-Windows-x64.zip

      - name: Build macOS Application Bundle
        if: runner.os == 'macOS'
        run: |
          python scripts/build_nuitka.py
          tar -czf dist/Oqteris-1.0.0-macOS-arm64.tar.gz -C dist Oqteris.app

      - name: Build Linux Standalone & Debian Package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y binutils dpkg-dev
          python scripts/build_nuitka.py
          tar -czf dist/Oqteris-1.0.0-Linux-x64.tar.gz -C dist Oqteris.dist

      - name: Upload Platform Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/Oqteris-1.0.0-*

  # -------------------------------------------------------------
  # Job 3: Publish GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Create GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums
        run: |
          cd release-artifacts
          find . -type f -name "Oqteris-*" -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/Oqteris-1.0.0-*
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
