name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Continuous Integration
  # -------------------------------------------------------------
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v --junitxml=junit/test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: junit/test-results.xml

  # -------------------------------------------------------------
  # Job 2: Build Native Installers
  # -------------------------------------------------------------
  build-release:
    name: Build Installers (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact-name: Oqteris-Windows-Installer
          - os: ubuntu-latest
            target: linux-x64
            artifact-name: Oqteris-Linux-Installers
          - os: macos-latest
            target: macos-arm64
            artifact-name: Oqteris-macOS-Installer
            allow-failure: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev rpm libgl1-mesa-dev libxkbcommon-x11-0 libegl1

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller setuptools wheel
          pip install PySide6-Addons

      # --- Windows: Inno Setup Installer (.exe) ---
      - name: Build Windows Installer (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      # --- macOS: DMG Disk Image Installer (.dmg) ---
      - name: Build macOS Installer (.dmg)
        if: runner.os == 'macOS'
        run: bash ./scripts/build_macos.sh

      # --- Linux: Debian (.deb) & Fedora/RHEL (.rpm) Installers ---
      - name: Build Linux Installers (.deb, .rpm)
        if: runner.os == 'Linux'
        run: bash ./scripts/build_linux.sh

      - name: Upload Platform Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm

  # -------------------------------------------------------------
  # Job 3: Attach Installers to GitHub Release (ONLY on Git Tag)
  # -------------------------------------------------------------
  publish-release:
    name: Attach Installers to Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Binaries to Tag Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
